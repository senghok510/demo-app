<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small idea board for collecting and tracking demo app ideas."
    />
    <title>Idea Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Tiny demo project</p>
        <h1>Turn sparks into plans.</h1>
        <p class="intro">
          Capture a small idea, keep the promising ones visible, and mark what you have explored.
        </p>
      </header>

      <section class="board" aria-labelledby="board-title">
        <div class="board-heading">
          <div>
            <p class="section-label">Workspace</p>
            <h2 id="board-title">Idea board</h2>
          </div>
          <p id="idea-count" class="idea-count" aria-live="polite">0 open ideas</p>
        </div>

        <form id="idea-form" class="idea-form">
          <label for="idea-input">What should we try next?</label>
          <div class="input-row">
            <input
              id="idea-input"
              name="idea"
              type="text"
              maxlength="80"
              placeholder="Add keyboard shortcuts…"
              autocomplete="off"
              required
            />
            <button type="submit">Add idea</button>
          </div>
          <p id="form-error" class="form-error" role="alert"></p>
        </form>

        <div class="search-field">
          <label for="search-input">Search ideas</label>
          <div class="search-input-wrap">
            <input
              id="search-input"
              type="search"
              placeholder="Search by title…"
              autocomplete="off"
              aria-controls="idea-list"
            />
            <button id="search-clear" class="search-clear" type="button" hidden>Clear</button>
          </div>
        </div>

        <div class="toolbar" aria-label="Filter ideas">
          <button class="filter is-active" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="open">Open</button>
          <button class="filter" type="button" data-filter="done">Done</button>
        </div>

        <ul id="idea-list" class="idea-list"></ul>
        <p id="empty-state" class="empty-state" hidden>No ideas in this view yet.</p>
      </section>
    </main>

    <template id="idea-template">
      <li class="idea-card">
        <label class="idea-content">
          <input class="idea-toggle" type="checkbox" />
          <span class="custom-checkbox" aria-hidden="true"></span>
          <span class="idea-title"></span>
        </label>
        <button class="delete-button" type="button" aria-label="Delete idea">Delete</button>
      </li>
    </template>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
